<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Pinnacle Content Admin</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body{
      min-height:100vh;
      background:#0d0e0f;
      color:white;
    }

    .admin-shell{
      width:min(1100px,calc(100% - 40px));
      margin:auto;
      padding:70px 0;
    }

    .admin-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:45px;
    }

    .admin-top small{
      display:block;
      color:#c7a35d;
      letter-spacing:.14em;
      margin-bottom:8px;
    }

    .admin-top h1{
      font-size:clamp(38px,6vw,64px);
    }

    .logout-btn{
      background:none;
      border:1px solid rgba(255,255,255,.2);
      color:white;
      padding:12px 18px;
      border-radius:999px;
      cursor:pointer;
    }

    .add-panel{
      border:1px solid rgba(255,255,255,.12);
      background:#151719;
      border-radius:20px;
      padding:28px;
      margin-bottom:45px;
    }

    .add-panel h2{
      font-size:28px;
      margin-bottom:8px;
    }

    .add-panel p{
      color:#999;
      margin-bottom:22px;
    }

    .content-form{
      display:grid;
      gap:14px;
    }

    .content-form input,
    .content-form textarea{
      width:100%;
      min-width:0;
      padding:15px 17px;
      border:1px solid rgba(255,255,255,.15);
      border-radius:12px;
      background:#0d0e0f;
      color:white;
      font:inherit;
    }

    .content-form textarea{
      min-height:160px;
      resize:vertical;
    }

    .content-form button{
      justify-self:start;
      padding:15px 22px;
      border:0;
      background:#c7a35d;
      color:#111;
      border-radius:999px;
      font-weight:800;
      cursor:pointer;
    }

    .admin-field{
      display:grid;
      gap:7px;
    }

    .admin-field label{
      color:#aaa;
      font-size:12px;
    }

    #admin-message,
    #testimonial-message{
      min-height:22px;
      margin-top:15px;
      color:#c7a35d;
    }

    .admin-video-list,
    .admin-testimonial-list{
      display:grid;
      gap:16px;
      margin-top:20px;
    }

    .admin-video,
    .admin-testimonial{
      display:grid;
      grid-template-columns:120px minmax(0,1fr) auto;
      align-items:center;
      gap:20px;
      padding:15px;
      border:1px solid rgba(255,255,255,.1);
      border-radius:16px;
      background:#151719;
    }

    .admin-video img,
    .admin-video-placeholder,
    .admin-testimonial img,
    .admin-testimonial-thumb{
      width:120px;
      aspect-ratio:1;
      object-fit:cover;
      border-radius:10px;
      background:#0d0e0f;
      display:grid;
      place-items:center;
      color:#c7a35d;
      font-weight:800;
    }

    .admin-video h3,
    .admin-testimonial h3{
      font-size:18px;
      margin-bottom:6px;
      overflow-wrap:anywhere;
    }

    .admin-testimonial p{
      margin:0;
      color:#999;
      font-size:12px;
    }

    .admin-video a{
      color:#999;
      font-size:12px;
    }

    .delete-video,
    .delete-testimonial{
      border:1px solid rgba(255,100,100,.35);
      background:none;
      color:#ff8c8c;
      padding:10px 15px;
      border-radius:999px;
      cursor:pointer;
    }

    .empty-state{
      color:#777;
      border:1px dashed rgba(255,255,255,.15);
      border-radius:16px;
      padding:30px;
      text-align:center;
    }

    @media(max-width:700px){
      .admin-video,
      .admin-testimonial{
        grid-template-columns:1fr;
      }

      .admin-video img,
      .admin-video-placeholder,
      .admin-testimonial img,
      .admin-testimonial-thumb{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <main class="admin-shell">

    <div class="admin-top">

      <div>
        <small>PINNACLE REALTY</small>
        <h1>Content Manager</h1>
      </div>

      <button
        id="logout"
        class="logout-btn"
      >
        Log Out
      </button>

    </div>


    <section class="add-panel">

      <h2>Add a Video</h2>

      <p id="video-save-note">
        Add a title, article, optional YouTube link and up to 10 images.
      </p>

      <form
        id="video-form"
        class="content-form"
        aria-describedby="video-save-note"
      >

        <div class="admin-field">
          <label for="video-title">Title</label>
          <input
            id="video-title"
            type="text"
            required
          >
        </div>

        <div class="admin-field">
          <label for="video-article">Article</label>
          <textarea id="video-article"></textarea>
        </div>

        <div class="admin-field">
          <label for="youtube-url">YouTube link</label>
          <input
            id="youtube-url"
            type="url"
            placeholder="https://www.youtube.com/watch?v=..."
          >
        </div>

        <div class="admin-field">
          <label for="video-images">Images (up to 10)</label>
          <input
            id="video-images"
            type="file"
            accept="image/*"
            multiple
          >
        </div>

        <button type="submit">
          Add Video
        </button>

      </form>

      <div id="admin-message" role="status" aria-live="polite"></div>

    </section>


    <section class="add-panel">

      <h2>Add a Testimonial</h2>

      <p>
        Add a title, article, optional YouTube link and up to 10 images.
      </p>

      <form
        id="testimonial-form"
        class="content-form"
      >

        <div class="admin-field">
          <label for="testimonial-title">Title</label>
          <input
            id="testimonial-title"
            type="text"
            required
          >
        </div>

        <div class="admin-field">
          <label for="testimonial-article">Article</label>
          <textarea
            id="testimonial-article"
            required
          ></textarea>
        </div>

        <div class="admin-field">
          <label for="testimonial-youtube-url">YouTube link</label>
          <input
            id="testimonial-youtube-url"
            type="url"
            placeholder="https://www.youtube.com/watch?v=..."
          >
        </div>

        <div class="admin-field">
          <label for="testimonial-images">Images</label>
          <input
            id="testimonial-images"
            type="file"
            accept="image/*"
            multiple
          >
        </div>

        <button type="submit">
          Add Testimonial
        </button>

      </form>

      <div id="testimonial-message"></div>

    </section>


    <section class="add-panel">

      <h2>Published Videos</h2>

      <div
        id="admin-video-list"
        class="admin-video-list"
      ></div>

    </section>


    <section class="add-panel">

      <h2>Published Testimonials</h2>

      <div
        id="admin-testimonial-list"
        class="admin-testimonial-list"
      ></div>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="admin.js"></script>

</body>

</html>
