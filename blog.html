  <style>

    /* ======================================================
       VIDEO EDUCATION SECTION
    ====================================================== */

    .page-hero.section-dark{
      background:#0d0e0f;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .education-video-section{
      background:#151719;
      color:#fff;
      padding:94px 0 100px;
      overflow:hidden;

      border-top:1px solid rgba(255,255,255,.08);

      box-shadow:
        inset 0 28px 60px rgba(0,0,0,.12);
    }


    .education-video-heading{
      display:grid;
      grid-template-columns:1fr .7fr;
      gap:60px;
      align-items:end;
      margin-bottom:50px;
    }


    .education-video-heading h2{
      font-family:Manrope,sans-serif;
      font-size:clamp(40px,5vw,66px);
      line-height:1.02;
      letter-spacing:-.045em;
      margin:0;
    }


    .education-video-heading h2 em{
      color:#c7a35d;
      font-style:normal;
    }


    .education-video-heading p{
      color:#aaa;
      font-size:15px;
      max-width:560px;
      margin:0;
    }


    .education-video-number{
      font:
        10px
        "DM Mono",
        monospace;

      letter-spacing:.1em;
      color:#808285;
      margin-bottom:22px;
    }


    .education-video-number span{
      margin-left:10px;
    }



    /* ======================================================
       VIDEO GRID
    ====================================================== */

    .education-video-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:20px;
    }


    .education-video-card{
      text-decoration:none;
      color:inherit;
      position:relative;

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius:18px;

      background:#141618;

      overflow:hidden;

      cursor:pointer;

      transition:
        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

      animation:
        educationVideoEnter
        .55s ease
        both;
    }


    .education-video-card:hover{
      transform:translateY(-6px);

      border-color:
        rgba(199,163,93,.48);

      box-shadow:
        0 24px 60px
        rgba(0,0,0,.30);
    }


    @keyframes educationVideoEnter{

      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }



    /* ======================================================
       VIDEO THUMBNAIL
    ====================================================== */

    .education-video-thumb{
      position:relative;

      aspect-ratio:16/9;

      overflow:hidden;

      background:#090a0b;
    }


    .education-video-thumb img{
      width:100%;
      height:100%;

      display:block;

      object-fit:cover;

      transition:
        transform .55s
        cubic-bezier(.2,.7,.2,1);
    }

    .education-video-placeholder{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color:#c7a35d;
      font:800 80px/1 Manrope,sans-serif;
    }

    .education-video-card:hover
    .education-video-thumb img{
      transform:scale(1.045);
    }


    .education-video-thumb::after{
      content:"";

      position:absolute;
      inset:0;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,.42),
          rgba(0,0,0,.02) 55%
        );

      pointer-events:none;
    }



    /* ======================================================
       PLAY BUTTON
    ====================================================== */

    .education-play{
      position:absolute;

      top:50%;
      left:50%;

      z-index:2;

      width:68px;
      height:68px;

      transform:
        translate(-50%,-50%);

      display:grid;
      place-items:center;

      border:0;
      border-radius:50%;

      background:#c7a35d;
      color:#111;

      cursor:pointer;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.35);

      transition:
        transform .28s ease,
        background .28s ease;
    }


    .education-video-card:hover
    .education-play{
      transform:
        translate(-50%,-50%)
        scale(1.08);

      background:#e0bf78;
    }


    .education-play svg{
      width:19px;
      height:19px;

      fill:currentColor;

      margin-left:3px;
    }



    /* ======================================================
       VIDEO CONTENT
    ====================================================== */

    .education-video-content{
      padding:23px 23px 25px;
    }


    .education-video-label{
      display:block;

      font:
        9px
        "DM Mono",
        monospace;

      letter-spacing:.13em;

      color:#c7a35d;

      margin-bottom:12px;
    }


    .education-video-content h3{
      font-family:Manrope,sans-serif;

      font-size:21px;
      line-height:1.16;

      letter-spacing:-.035em;

      color:#fff;

      margin:0;
    }


    .education-video-action{
      display:flex;
      align-items:center;
      gap:8px;

      color:#aaa;

      font-size:12px;
      font-weight:600;

      margin-top:18px;

      transition:color .25s ease;
    }


    .education-video-card:hover
    .education-video-action{
      color:#e0bf78;
    }



    /* ======================================================
       LOADING / EMPTY / ERROR STATES
    ====================================================== */

    .education-video-state{
      grid-column:1/-1;

      min-height:180px;

      display:flex;
      align-items:center;
      justify-content:center;

      text-align:center;

      border:
        1px dashed
        rgba(255,255,255,.13);

      border-radius:18px;

      color:#777;

      padding:35px;
    }


    .education-loader{
      width:28px;
      height:28px;

      border:
        2px solid
        rgba(255,255,255,.15);

      border-top-color:#c7a35d;

      border-radius:50%;

      animation:
        educationSpin
        .8s linear
        infinite;

      margin:0 auto 15px;
    }


    @keyframes educationSpin{
      to{
        transform:rotate(360deg);
      }
    }



    /* ======================================================
       LOAD MORE
    ====================================================== */

    .education-load-more-wrap{
      display:none;

      justify-content:center;

      margin-top:45px;
    }


    .education-load-more-wrap.visible{
      display:flex;
    }


    .education-load-more{
      min-width:150px;

      border:0;

      border-radius:999px;

      padding:15px 25px;

      background:#c7a35d;

      color:#111;

      font:800 13px Inter,sans-serif;

      cursor:pointer;

      transition:
        background .25s ease,
        transform .25s ease;
    }


    .education-load-more:hover{
      background:#e0bf78;
      transform:translateY(-2px);
    }


    .education-load-more:disabled{
      opacity:.55;
      cursor:default;
      transform:none;
    }



    /* ======================================================
       MOBILE
    ====================================================== */

    @media(max-width:900px){

      .education-video-heading{
        grid-template-columns:1fr;
        gap:22px;
      }


      .education-video-grid{
        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }

    }


    @media(max-width:650px){

      }

      }


      .education-video-content{
        padding:20px;
      }









      .education-play{
        width:60px;
        height:60px;
      }

    }

  <!-- ======================================================
       EDUCATION VIDEO LOGIC
  ====================================================== -->

  <script>

    /* ====================================================
       ELEMENTS
    ==================================================== */

    const educationGrid =
      document.getElementById(
        "education-video-grid"
      );


    const loadMoreWrap =
      document.getElementById(
        "education-load-more-wrap"
      );


    const loadMoreButton =
      document.getElementById(
        "education-load-more"
      );





    /* ====================================================
       VIDEO PAGINATION
    ==================================================== */

    const VIDEOS_PER_PAGE = 3;

    let educationVideos = [];

    let visibleVideoCount =
      VIDEOS_PER_PAGE;



    /* ====================================================
       LOAD VIDEOS FROM SUPABASE
    ==================================================== */

    async function loadEducationVideos(){

      const {
        data,
        error
      } = await Content.select(db, "education_videos", "id,youtube_id,youtube_url,title,article,image_urls,thumbnail_url,created_at", query => query.order("created_at", { ascending: false }));


      if(error){

        console.error(
          "Unable to load Education articles:",
          error
        );


        educationGrid.innerHTML = `

          <div class="education-video-state">

            We couldn't load the articles right now.
            Please try again later.

          </div>

        `;


        loadMoreWrap.classList.remove(
          "visible"
        );


        return;

      }


      educationVideos =
        Array.isArray(data)
          ? data
          : [];


      if(
        educationVideos.length === 0
      ){

        educationGrid.innerHTML = `

          <div class="education-video-state">

            New articles are coming soon.

          </div>

        `;


        loadMoreWrap.classList.remove(
          "visible"
        );


        return;

      }


      await Content.loadRoutes();
      renderEducationVideos();

    }



    /* ====================================================
       RENDER VIDEOS
    ==================================================== */

    function getEducationVideoCover(video) {
      // Reuse the existing thumbnail_url column for dedicated and legacy covers.
      if (typeof video.thumbnail_url === "string" && video.thumbnail_url.trim()) {
        return video.thumbnail_url.trim();
      }
      const firstImage = Array.isArray(video.image_urls) ? video.image_urls[0] : null;
      if (typeof firstImage === "string" && firstImage.trim()) {
        return firstImage;
      }
      return "";
    }

    function renderEducationVideos() {
      educationGrid.innerHTML = educationVideos.slice(0, visibleVideoCount).map((article, index) => {
        const cover = getEducationVideoCover(article);
        const href = Content.url("article", article);
        return `
          <a class="education-video-card" href="${escapeEducationHtml(href)}"
             style="animation-delay:${(index % 3) * 80}ms">
            <div class="education-video-thumb">
              ${cover ? `<img src="${escapeEducationHtml(cover)}" alt="" loading="lazy" decoding="async">`
                : '<div class="education-video-placeholder" aria-hidden="true">P</div>'}
            </div>
            <div class="education-video-content">
              <span class="education-video-label">PINNACLE ARTICLE</span>
              <h3>${escapeEducationHtml(article.title)}</h3>
              <div class="education-video-action">Read Article <span aria-hidden="true">&rarr;</span></div>
            </div>
          </a>
        `;
      }).join("");

      attachArticleCardEvents();
      loadMoreWrap.classList.toggle("visible", visibleVideoCount < educationVideos.length);
    }

    function attachArticleCardEvents() {
      document.querySelectorAll(".education-video-card").forEach(card => {
        // Enter and mouse clicks use native links; Space retains the previous card behavior.
        card.addEventListener("keydown", event => {
          if (event.key === " ") {
            event.preventDefault();
            card.click();
          }
        });
      });
    }



    /* ====================================================
       LOAD MORE
    ==================================================== */

    loadMoreButton.addEventListener(
      "click",
      () => {

        loadMoreButton.disabled =
          true;


        loadMoreButton.textContent =
          "Loading...";


        setTimeout(
          () => {

            visibleVideoCount +=
              VIDEOS_PER_PAGE;


            renderEducationVideos();


            loadMoreButton.disabled =
              false;


            loadMoreButton.textContent =
              "Load More";

          },
          180
        );

      }
    );



    /* ====================================================
       HTML ESCAPING
    ==================================================== */

    function escapeEducationHtml(
      value
    ){

      return String(
        value ?? ""
      )

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }



    /* ====================================================
       START
    ==================================================== */

    loadEducationVideos();

  </script>
