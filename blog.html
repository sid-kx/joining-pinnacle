  <!-- EDUCATION VIDEO CSS -->
  <style>

    /* ======================================================
       VIDEO EDUCATION SECTION
    ====================================================== */

    .page-hero.section-dark{
      background:#0d0e0f;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .education-video-section{
      background:#151719;
      color:#fff;
      padding:94px 0 100px;
      overflow:hidden;

      border-top:1px solid rgba(255,255,255,.08);

      box-shadow:
        inset 0 28px 60px rgba(0,0,0,.12);
    }


    .education-video-heading{
      display:grid;
      grid-template-columns:1fr .7fr;
      gap:60px;
      align-items:end;
      margin-bottom:50px;
    }


    .education-video-heading h2{
      font-family:Manrope,sans-serif;
      font-size:clamp(40px,5vw,66px);
      line-height:1.02;
      letter-spacing:-.045em;
      margin:0;
    }


    .education-video-heading h2 em{
      color:#c7a35d;
      font-style:normal;
    }


    .education-video-heading p{
      color:#aaa;
      font-size:15px;
      max-width:560px;
      margin:0;
    }


    .education-video-number{
      font:
        10px
        "DM Mono",
        monospace;

      letter-spacing:.1em;
      color:#808285;
      margin-bottom:22px;
    }


    .education-video-number span{
      margin-left:10px;
    }



    /* ======================================================
       VIDEO GRID
    ====================================================== */

    .education-video-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:20px;
    }


    .education-video-card{
      position:relative;

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius:18px;

      background:#141618;

      overflow:hidden;

      cursor:pointer;

      transition:
        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

      animation:
        educationVideoEnter
        .55s ease
        both;
    }


    .education-video-card:hover{
      transform:translateY(-6px);

      border-color:
        rgba(199,163,93,.48);

      box-shadow:
        0 24px 60px
        rgba(0,0,0,.30);
    }


    @keyframes educationVideoEnter{

      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }



    /* ======================================================
       VIDEO THUMBNAIL
    ====================================================== */

    .education-video-thumb{
      position:relative;

      aspect-ratio:16/9;

      overflow:hidden;

      background:#090a0b;
    }


    .education-video-thumb img{
      width:100%;
      height:100%;

      display:block;

      object-fit:cover;

      transition:
        transform .55s
        cubic-bezier(.2,.7,.2,1);
    }

    .education-video-placeholder{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color:#c7a35d;
      font:800 80px/1 Manrope,sans-serif;
    }

    .education-video-card:hover
    .education-video-thumb img{
      transform:scale(1.045);
    }


    .education-video-thumb::after{
      content:"";

      position:absolute;
      inset:0;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,.42),
          rgba(0,0,0,.02) 55%
        );

      pointer-events:none;
    }



    /* ======================================================
       PLAY BUTTON
    ====================================================== */

    .education-play{
      position:absolute;

      top:50%;
      left:50%;

      z-index:2;

      width:68px;
      height:68px;

      transform:
        translate(-50%,-50%);

      display:grid;
      place-items:center;

      border:0;
      border-radius:50%;

      background:#c7a35d;
      color:#111;

      cursor:pointer;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.35);

      transition:
        transform .28s ease,
        background .28s ease;
    }


    .education-video-card:hover
    .education-play{
      transform:
        translate(-50%,-50%)
        scale(1.08);

      background:#e0bf78;
    }


    .education-play svg{
      width:19px;
      height:19px;

      fill:currentColor;

      margin-left:3px;
    }



    /* ======================================================
       VIDEO CONTENT
    ====================================================== */

    .education-video-content{
      padding:23px 23px 25px;
    }


    .education-video-label{
      display:block;

      font:
        9px
        "DM Mono",
        monospace;

      letter-spacing:.13em;

      color:#c7a35d;

      margin-bottom:12px;
    }


    .education-video-content h3{
      font-family:Manrope,sans-serif;

      font-size:21px;
      line-height:1.16;

      letter-spacing:-.035em;

      color:#fff;

      margin:0;
    }


    .education-video-action{
      display:flex;
      align-items:center;
      gap:8px;

      color:#aaa;

      font-size:12px;
      font-weight:600;

      margin-top:18px;

      transition:color .25s ease;
    }


    .education-video-card:hover
    .education-video-action{
      color:#e0bf78;
    }



    /* ======================================================
       LOADING / EMPTY / ERROR STATES
    ====================================================== */

    .education-video-state{
      grid-column:1/-1;

      min-height:180px;

      display:flex;
      align-items:center;
      justify-content:center;

      text-align:center;

      border:
        1px dashed
        rgba(255,255,255,.13);

      border-radius:18px;

      color:#777;

      padding:35px;
    }


    .education-loader{
      width:28px;
      height:28px;

      border:
        2px solid
        rgba(255,255,255,.15);

      border-top-color:#c7a35d;

      border-radius:50%;

      animation:
        educationSpin
        .8s linear
        infinite;

      margin:0 auto 15px;
    }


    @keyframes educationSpin{
      to{
        transform:rotate(360deg);
      }
    }



    /* ======================================================
       LOAD MORE
    ====================================================== */

    .education-load-more-wrap{
      display:none;

      justify-content:center;

      margin-top:45px;
    }


    .education-load-more-wrap.visible{
      display:flex;
    }


    .education-load-more{
      min-width:150px;

      border:0;

      border-radius:999px;

      padding:15px 25px;

      background:#c7a35d;

      color:#111;

      font:800 13px Inter,sans-serif;

      cursor:pointer;

      transition:
        background .25s ease,
        transform .25s ease;
    }


    .education-load-more:hover{
      background:#e0bf78;
      transform:translateY(-2px);
    }


    .education-load-more:disabled{
      opacity:.55;
      cursor:default;
      transform:none;
    }



    /* ======================================================
       VIDEO MODAL
    ====================================================== */

    .education-modal{
      position:fixed;
      inset:0;

      z-index:99999;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:28px;

      opacity:0;
      visibility:hidden;

      pointer-events:none;

      transition:
        opacity .3s ease,
        visibility .3s ease;
    }


    .education-modal.open{
      opacity:1;
      visibility:visible;

      pointer-events:auto;
    }


    .education-modal-backdrop{
      position:absolute;
      inset:0;

      background:
        rgba(3,4,5,.91);

      backdrop-filter:blur(13px);
      -webkit-backdrop-filter:blur(13px);
    }


    .education-modal-dialog{
      position:relative;

      z-index:2;

      width:min(980px,100%);
      max-height:min(86vh,900px);
      overflow:auto;
      padding:34px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:22px;
      background:#111315;
      color:#fff;

      opacity:0;

      transform:
        translateY(18px)
        scale(.975);

      transition:
        opacity .32s ease,
        transform .32s
        cubic-bezier(.2,.8,.2,1);
    }


    .education-modal.open
    .education-modal-dialog{
      opacity:1;

      transform:
        translateY(0)
        scale(1);
    }



    /* ======================================================
       MODAL HEADER
    ====================================================== */

    .education-modal-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;

      gap:25px;

      margin-bottom:17px;
    }


    .education-modal-copy{
      min-width:0;
    }


    .education-modal-kicker{
      display:block;

      font:
        9px
        "DM Mono",
        monospace;

      letter-spacing:.14em;

      color:#c7a35d;

      margin-bottom:7px;
    }


    .education-modal-title{
      font-family:Manrope,sans-serif;

      font-size:29px;

      line-height:1.12;

      letter-spacing:0;
      overflow-wrap:anywhere;

      color:#fff;

      margin:0;

      max-width:820px;
    }


    .education-modal-close{
      flex:0 0 auto;

      width:46px;
      height:46px;

      border:
        1px solid
        rgba(255,255,255,.18);

      border-radius:50%;

      background:
        rgba(255,255,255,.04);

      color:#fff;

      font-size:26px;
      line-height:1;

      cursor:pointer;

      transition:
        background .25s ease,
        border-color .25s ease;
    }


    .education-modal-close:hover{
      background:
        rgba(255,255,255,.10);

      border-color:
        rgba(199,163,93,.65);
    }



    /* ======================================================
       MODAL PLAYER
    ====================================================== */

    .education-modal-player{
      width:100%;

      aspect-ratio:16/9;

      overflow:hidden;

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius:8px;

      background:#000;

      box-shadow:
        0 30px 100px
        rgba(0,0,0,.6);
    }


    .education-modal-player iframe{
      width:100%;
      height:100%;

      display:block;

      border:0;
    }

    .education-modal-player[hidden]{
      display:none;
    }
    .education-modal-details{
      display:contents;
    }


    /* ======================================================
       MOBILE
    ====================================================== */

    @media(max-width:900px){

      .education-video-heading{
        grid-template-columns:1fr;
        gap:22px;
      }


      .education-video-grid{
        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }

    }


    @media(max-width:650px){

      .education-video-section{
        padding:72px 0;
      }


      .education-video-grid{
        grid-template-columns:1fr;
      }


      .education-video-content{
        padding:20px;
      }


      .education-modal{
        padding:17px;
      }


      .education-modal-top{
        align-items:center;
      }

      .education-modal-dialog{
        padding:26px 20px;
      }

      .education-modal-title{
        font-size:24px;
      }

      .education-modal-close{
        width:42px;
        height:42px;
      }


      .education-play{
        width:60px;
        height:60px;
      }

    }

  </style>

  <!-- ======================================================
       EDUCATION VIDEO LOGIC
  ====================================================== -->

  <script>

    /* ====================================================
       ELEMENTS
    ==================================================== */

    const educationGrid =
      document.getElementById(
        "education-video-grid"
      );


    const loadMoreWrap =
      document.getElementById(
        "education-load-more-wrap"
      );


    const loadMoreButton =
      document.getElementById(
        "education-load-more"
      );


    const videoModal =
      document.getElementById(
        "education-video-modal"
      );


    const videoPlayer =
      document.getElementById(
        "education-youtube-player"
      );

    const videoPlayerSection = videoPlayer.parentElement;

    const videoModalTitle =
      document.getElementById(
        "education-modal-title"
      );


    const videoModalClose =
      document.getElementById(
        "education-modal-close"
      );

    const videoModalDetails = document.getElementById("education-modal-details");


    /* ====================================================
       VIDEO PAGINATION
    ==================================================== */

    const VIDEOS_PER_PAGE = 3;

    let educationVideos = [];

    let visibleVideoCount =
      VIDEOS_PER_PAGE;



    /* ====================================================
       LOAD VIDEOS FROM SUPABASE
    ==================================================== */

    async function loadEducationVideos(){

      const {
        data,
        error
      } = await db
        .from("education_videos")
        .select(
          `
            id,
            youtube_id,
            youtube_url,
            title,
            article,
            image_urls,
            thumbnail_url,
            created_at
          `
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


      if(error){

        console.error(
          "Unable to load Education videos:",
          error
        );


        educationGrid.innerHTML = `

          <div class="education-video-state">

            We couldn't load the videos right now.
            Please try again later.

          </div>

        `;


        loadMoreWrap.classList.remove(
          "visible"
        );


        return;

      }


      educationVideos =
        Array.isArray(data)
          ? data
          : [];


      if(
        educationVideos.length === 0
      ){

        educationGrid.innerHTML = `

          <div class="education-video-state">

            New education videos are coming soon.

          </div>

        `;


        loadMoreWrap.classList.remove(
          "visible"
        );


        return;

      }


      renderEducationVideos();

    }



    /* ====================================================
       RENDER VIDEOS
    ==================================================== */

    function getEducationVideoCover(video) {
      const firstImage = Array.isArray(video.image_urls) ? video.image_urls[0] : null;
      if (typeof firstImage === "string" && firstImage.trim()) {
        return firstImage;
      }
      // Only old rows need thumbnail_url; new posts use their first uploaded image.
      return typeof video.thumbnail_url === "string" ? video.thumbnail_url.trim() : "";
    }

    function getEducationYoutubeId(video) {
      if (video.youtube_id) {
        return video.youtube_id;
      }
      try {
        const url = new URL(video.youtube_url);
        const parts = url.pathname.split("/").filter(Boolean);
        if (url.hostname === "youtu.be" || url.hostname === "www.youtu.be") {
          return parts[0] || "";
        }
        if (["youtube.com", "www.youtube.com", "m.youtube.com", "youtube-nocookie.com", "www.youtube-nocookie.com"].includes(url.hostname)) {
          return url.searchParams.get("v") ||
            (["embed", "shorts", "live"].includes(parts[0]) ? parts[1] || "" : "");
        }
      } catch {
        return "";
      }
      return "";
    }

    function renderEducationVideos(){

      const visibleVideos =
        educationVideos.slice(
          0,
          visibleVideoCount
        );


      educationGrid.innerHTML =
        visibleVideos
          .map(
            (video,index) => {

              const cover = getEducationVideoCover(video);
              const youtubeId = getEducationYoutubeId(video);

              const delay =
                (index % 3) * 80;


              return `

                <article
                  class="education-video-card"
                  data-record-id="${escapeEducationHtml(video.id)}"
                  data-video-id="${escapeEducationHtml(video.youtube_id)}"
                  data-video-title="${escapeEducationHtml(video.title)}"
                  tabindex="0"
                  role="button"
                  aria-label="Open ${escapeEducationHtml(video.title)}"
                  style="
                    animation-delay:
                    ${delay}ms;
                  "
                >

                  <div class="education-video-thumb">

                    ${cover ? `<img
                      src="${escapeEducationHtml(cover)}"
                      alt="${escapeEducationHtml(video.title)}"
                      loading="lazy"
                      decoding="async"
                    >` : `<div class="education-video-placeholder" aria-hidden="true">P</div>`}


                    ${youtubeId ? `<button
                      class="education-play"
                      type="button"
                      tabindex="-1"
                      aria-hidden="true"
                    >

                      <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                      >

                        <path
                          d="M8 5v14l11-7z"
                        />

                      </svg>

                    </button>` : ""}

                  </div>


                  <div class="education-video-content">

                    <span class="education-video-label">
                      PINNACLE VIDEO
                    </span>


                    <h3>
                      ${escapeEducationHtml(video.title)}
                    </h3>


                    <div class="education-video-action">
                      ${youtubeId ? "Watch video" : "Read"}
                      <span>↗</span>
                    </div>

                  </div>

                </article>

              `;

            }
          )
          .join("");


      attachEducationVideoEvents();


      if(
        visibleVideoCount <
        educationVideos.length
      ){

        loadMoreWrap.classList.add(
          "visible"
        );

      }

      else{

        loadMoreWrap.classList.remove(
          "visible"
        );

      }

    }



    /* ====================================================
       CLICK / KEYBOARD EVENTS
    ==================================================== */

    function attachEducationVideoEvents(){

      document
        .querySelectorAll(
          ".education-video-card"
        )
        .forEach(
          card => {

            const open = () => {
              const video = educationVideos.find(
                item => String(item.id) === card.dataset.recordId
              );
              if (video) {
                openEducationVideo(video);
              }
            };

            card.addEventListener(
              "click",
              open
            );


            card.addEventListener(
              "keydown",
              event => {

                if(
                  event.key === "Enter" ||
                  event.key === " "
                ){

                  event.preventDefault();


                  open();

                }

              }
            );

          }
        );

    }



    /* ====================================================
       LOAD MORE
    ==================================================== */

    loadMoreButton.addEventListener(
      "click",
      () => {

        loadMoreButton.disabled =
          true;


        loadMoreButton.textContent =
          "Loading...";


        setTimeout(
          () => {

            visibleVideoCount +=
              VIDEOS_PER_PAGE;


            renderEducationVideos();


            loadMoreButton.disabled =
              false;


            loadMoreButton.textContent =
              "Load More";

          },
          180
        );

      }
    );



    /* ====================================================
       OPEN VIDEO MODAL
    ==================================================== */

    function renderEducationVideoDetails(video) {
      const images = Array.isArray(video.image_urls) ? video.image_urls.slice(0, 10) : [];
      const article = typeof video.article === "string" ? video.article : "";

      videoModalDetails.innerHTML = `
        ${images.length ? `
          <section class="testimonial-carousel" aria-label="Video photos" aria-roledescription="carousel">
            <div class="testimonial-carousel-stage">
              <img
                src="${escapeEducationHtml(images[0])}"
                alt="${escapeEducationHtml(video.title)} image 1"
                decoding="async"
              >
            </div>
            <div class="testimonial-carousel-controls">
              ${images.length > 1 ? `
                <button type="button" data-photo-step="-1" aria-label="Previous photo" title="Previous photo">
                  <span aria-hidden="true">&larr;</span>
                </button>
              ` : ""}
              <span class="testimonial-carousel-counter" role="status" aria-live="polite" aria-atomic="true">1 / ${images.length}</span>
              ${images.length > 1 ? `
                <button type="button" data-photo-step="1" aria-label="Next photo" title="Next photo">
                  <span aria-hidden="true">&rarr;</span>
                </button>
              ` : ""}
            </div>
          </section>
        ` : ""}
        ${article ? `<p>${escapeEducationHtml(article)}</p>` : ""}
      `;

      let photoIndex = 0;
      const photo = videoModalDetails.querySelector(".testimonial-carousel-stage img");
      const counter = videoModalDetails.querySelector(".testimonial-carousel-counter");

      // Replaced with the details on each opening, matching the testimonial carousel.
      videoModalDetails.querySelectorAll("[data-photo-step]").forEach(button => {
        button.addEventListener("click", () => {
          photoIndex = (photoIndex + Number(button.dataset.photoStep) + images.length) % images.length;
          photo.src = images[photoIndex];
          photo.alt = `${video.title || "Pinnacle Education"} image ${photoIndex + 1}`;
          counter.textContent = `${photoIndex + 1} / ${images.length}`;
        });
      });
    }

    let videoModalPreviousOverflow = "";

    function openEducationVideo(video) {
      if (!video) {
        return;
      }

      if (!videoModal.classList.contains("open")) {
        videoModalPreviousOverflow = document.body.style.overflow;
      }

      videoModalTitle.textContent = video.title || "Pinnacle Education";
      videoPlayer.title = video.title || "Pinnacle Realty education video";
      const youtubeId = getEducationYoutubeId(video);
      videoPlayerSection.hidden = !youtubeId;
      if (youtubeId) {
        videoPlayer.src =
          "https://www.youtube.com/embed/" +
          encodeURIComponent(youtubeId) +
          "?autoplay=1&rel=0&modestbranding=1";
      } else {
        videoPlayer.removeAttribute("src");
      }

      renderEducationVideoDetails(video);
      videoModal.querySelector(".education-modal-dialog").scrollTop = 0;
      videoModal.classList.add("open");
      videoModal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      videoModalClose.focus();
    }

    function closeEducationVideo() {
      if (!videoModal.classList.contains("open")) {
        return;
      }

      videoModal.classList.remove("open");
      videoModal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = videoModalPreviousOverflow;

      // Clear immediately so a delayed close cannot erase a newly opened video.
      videoPlayer.src = "";
      videoModalDetails.innerHTML = "";
      videoModalTitle.textContent = "Video";
    }



    /* ====================================================
       MODAL CLOSE EVENTS
    ==================================================== */

    videoModalClose.addEventListener(
      "click",
      closeEducationVideo
    );


    document
      .querySelectorAll(
        "[data-close-video-modal]"
      )
      .forEach(
        element => {

          element.addEventListener(
            "click",
            closeEducationVideo
          );

        }
      );


    document.addEventListener(
      "keydown",
      event => {

        if(
          event.key === "Escape" &&
          videoModal.classList.contains(
            "open"
          )
        ){

          closeEducationVideo();

        }

      }
    );



    /* ====================================================
       HTML ESCAPING
    ==================================================== */

    function escapeEducationHtml(
      value
    ){

      return String(
        value ?? ""
      )

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }



    /* ====================================================
       START
    ==================================================== */

    loadEducationVideos();

  </script>

</body>

</html>
